name: meshca

# Everything except the observer itself. Settings come from .env (see .env.example).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/meshca/entrypoint.sh"]
    environment:
      MQTT_OBSERVER_PASSWORD: ${MQTT_OBSERVER_PASSWORD:?set in .env}
      MQTT_COLLECTOR_PASSWORD: ${MQTT_COLLECTOR_PASSWORD:?set in .env}
    volumes:
      - ./mosquitto:/meshca:ro
    ports:
      - "${MESHCA_MQTT_BIND:-0.0.0.0}:${MESHCA_MQTT_PORT:-1884}:1883"
    mem_limit: 64m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: meshca
      POSTGRES_USER: meshca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    # Small on purpose: the host is shared with another application.
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=512MB
      -c max_connections=30
      -c wal_compression=on
      -c checkpoint_timeout=15min
    volumes:
      - ${MESHCA_DATA_DIR:?set in .env}/postgres:/var/lib/postgresql/data
    ports:
      - "${MESHCA_PG_BIND:-127.0.0.1}:${MESHCA_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshca -d meshca"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 128m
    mem_limit: 768m
    logging: *logging

  migrate:
    build: &collector-build
      context: .
      dockerfile: collector/Dockerfile
    restart: "no"
    command: ["python", "-m", "meshca_collector.migrate"]
    environment:
      <<: &db-env
        PGHOST: postgres
        PGPORT: "5432"
        PGDATABASE: meshca
        PGUSER: meshca
        PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      READER_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
      REPORT_TIMEZONE: ${MESHCA_TIMEZONE:-UTC}
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  collector:
    build: *collector-build
    restart: unless-stopped
    environment:
      <<: *db-env
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: collector
      MQTT_PASSWORD: ${MQTT_COLLECTOR_PASSWORD:?set in .env}
      MQTT_TOPICS: ${MESHCA_MQTT_TOPICS:-meshcore/#}
    depends_on:
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-m", "meshca_collector.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *db-env
      CHANNELS: ${MESHCA_CHANNELS:-}
      TEXT_RETENTION_DAYS: ${MESHCA_TEXT_RETENTION_DAYS:-30}
      ALERT_WEBHOOK_URL: ${MESHCA_ALERT_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${MESHCA_ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${MESHCA_ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_STATUS_GAP_MIN: ${MESHCA_ALERT_STATUS_GAP_MIN:-15}
      ALERT_PACKET_GAP_MIN: ${MESHCA_ALERT_PACKET_GAP_MIN:-30}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-m", "meshca_worker.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      # Open for reading inside the local network; changing anything needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ${MESHCA_DATA_DIR:?set in .env}/grafana:/var/lib/grafana
    user: "472:0"
    ports:
      - "${MESHCA_GRAFANA_BIND:-0.0.0.0}:${MESHCA_GRAFANA_PORT:-3001}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 384m
    logging: *logging
