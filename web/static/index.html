<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meshca · карта</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<aside id="panel">
  <div class="modes" role="tablist">
    <button data-mode="path" class="on" role="tab" data-help="mode-path">Как пакеты доходят до нас</button>
    <button data-mode="talk" role="tab" data-help="mode-talk">Кто с кем общается</button>
  </div>
  <p id="modeText" class="sub"></p>

  <section class="controls">
    <label class="row"><span>Период <i class="help" data-help="days">?</i></span>
      <select id="days">
        <option value="1">сутки</option>
        <option value="7" selected>7 дней</option>
        <option value="30">30 дней</option>
      </select>
    </label>
    <div class="row kinds">
      <label data-modes="path" data-help="adverts"><input type="checkbox" data-kind="adverts" checked><i class="sw adverts"></i>объявления</label>
      <label data-help="channel"><input type="checkbox" data-kind="channel" checked><i class="sw channel"></i>каналы</label>
      <label data-help="direct"><input type="checkbox" data-kind="direct" checked><i class="sw direct"></i>личные сообщения</label>
      <label data-help="service"><input type="checkbox" data-kind="service" checked><i class="sw service"></i>служебные</label>
    </div>
    <label class="row"><span>Показывать связи от <output id="minOut">5</output> <span id="minUnit">пакетов</span> <i class="help" data-help="min">?</i></span>
      <input type="range" id="min" min="0" max="100" value="35">
    </label>
    <label class="row toggle" data-modes="path" data-help="risks"><input type="checkbox" id="risks"> только узлы, без которых кто-то пропадёт <i class="help" data-help="risks">?</i></label>
  </section>

  <section id="stats" class="stats" data-help="stats"></section>

  <details class="legend" open>
    <summary>Как читать</summary>
    <div id="legend"></div>
  </details>
</aside>

<aside id="card" hidden>
  <button id="cardClose" aria-label="Закрыть">×</button>
  <div id="cardBody"></div>
</aside>

<div id="tip" hidden></div>
<div id="status"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
